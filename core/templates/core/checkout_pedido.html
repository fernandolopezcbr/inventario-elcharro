<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - El Charro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f3f6ff;
            font-family: 'Poppins', sans-serif;
        }

        .navbar-custom {
            background: linear-gradient(135deg, #003B5C 0%, #005F8D 100%);
        }

        .navbar-custom .navbar-brand,
        .navbar-custom .nav-link {
            color: white !important;
        }

        .container-custom {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .card-header-custom {
            background: linear-gradient(135deg, #003B5C 0%, #005F8D 100%);
            color: white;
        }

        .producto-item {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}"><i class="fas fa-box"></i> El Charro</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><span class="nav-link"><i class="fas fa-user"></i> {{ nombre_usuario }}</span>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'catalogo_pedidos' %}"><i
                                class="fas fa-store"></i> Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'home' %}"><i class="fas fa-home"></i>
                            Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}"><i
                                class="fas fa-sign-out-alt"></i> Salir</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-custom">
        <div class="mb-3">
            <a href="{% url 'catalogo_pedidos' %}" class="btn btn-secondary btn-sm"><i class="fas fa-arrow-left"></i>
                Volver al Catálogo</a>
        </div>

        <div class="card">
            <div class="card-header card-header-custom">
                <h5 class="mb-0"><i class="fas fa-clipboard-list"></i> Datos del Cliente</h5>
            </div>
            <div class="card-body">
                <!-- Buscador de cliente -->
                <div class="row mb-3">
                    <div class="col-md-8">
                        <label class="form-label">Buscar Cliente por NIT o Nombre</label>
                        <input type="text" id="buscar_cliente" class="form-control"
                            placeholder="Escriba NIT o nombre...">
                        <div id="resultados_cliente" class="list-group mt-2" style="display:none;"></div>
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <button class="btn btn-success w-100" data-bs-toggle="modal"
                            data-bs-target="#modalNuevoCliente">
                            <i class="fas fa-plus"></i> Nuevo Cliente
                        </button>
                    </div>
                </div>

                <!-- Cliente seleccionado -->
                <input type="hidden" id="cliente_id">
                <div id="cliente_seleccionado" class="alert alert-info" style="display:none;">
                    <strong>Cliente seleccionado:</strong> <span id="cliente_nombre"></span> - NIT: <span
                        id="cliente_nit"></span>
                    <br><strong>Dirección:</strong> <span id="cliente_direccion"></span>
                </div>

                <!-- Cliente por defecto (Consumidor Final) -->


                <hr>
                <h6>Resumen del Pedido</h6>
                <div id="resumenCarrito" class="mb-3"></div>

                <div class="d-flex justify-content-between align-items-center mt-3">
                    <h5>Total: <span id="totalPedido">Q0.00</span></h5>
                    <button type="submit" id="btnConfirmar" class="btn btn-primary btn-lg">Confirmar Pedido</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Nuevo Cliente -->
    <div class="modal fade" id="modalNuevoCliente" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title"><i class="fas fa-user-plus"></i> Nuevo Cliente</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="formNuevoCliente">
                    {% csrf_token %}
                    <div class="modal-body">
                        <div class="mb-3"><label>NIT *</label><input type="text" class="form-control" name="nit"
                                required></div>
                        <div class="mb-3"><label>Nombre/Razón Social *</label><input type="text" class="form-control"
                                name="nombre" required></div>
                        <div class="mb-3"><label>Dirección</label><textarea class="form-control" name="direccion"
                                rows="2"></textarea></div>
                        <div class="mb-3"><label>Teléfono</label><input type="text" class="form-control"
                                name="telefono"></div>
                        <div class="mb-3"><label>Observaciones</label><textarea class="form-control"
                                name="observaciones" rows="2"></textarea></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success">Guardar Cliente</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let carrito = JSON.parse(localStorage.getItem('carrito_pedidos')) || [];
        let clienteSeleccionado = null;

        function mostrarResumen() {
            let html = '<div class="table-responsive"><table class="table table-sm">';
            html += '<thead><tr><th>Producto</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th></thead><tbody>';
            let total = 0;
            carrito.forEach((item, index) => {
                let subtotal = item.cantidad * item.precio;
                total += subtotal;
                html += `
                    <tr>
                        <td>${item.producto}<br><small>${item.codigo} - ${item.ubicacion}</small></td>
                        <td><input type="number" class="form-control form-control-sm cantidad-item" style="width:80px" value="${item.cantidad}" min="1" data-index="${index}"></td>
                        <td><input type="number" step="0.01" class="form-control form-control-sm precio-item" style="width:100px" value="${item.precio}" data-index="${index}"></td>
                        <td class="subtotal-item" data-index="${index}">Q${subtotal.toFixed(2)}</td>
                    </tr>
                `;
            });
            html += '</tbody></table></div>';
            $('#resumenCarrito').html(html);
            $('#totalPedido').text('Q' + total.toFixed(2));

            // Eventos para modificar cantidad y precio
            $('.cantidad-item').on('change', function () {
                let index = $(this).data('index');
                let nuevaCantidad = parseInt($(this).val());
                if (nuevaCantidad > 0) {
                    carrito[index].cantidad = nuevaCantidad;
                    actualizarTotales();
                }
            });

            $('.precio-item').on('change', function () {
                let index = $(this).data('index');
                let nuevoPrecio = parseFloat($(this).val());
                if (nuevoPrecio >= 0) {
                    carrito[index].precio = nuevoPrecio;
                    actualizarTotales();
                }
            });
        }

        function actualizarTotales() {
            let total = 0;
            carrito.forEach((item, index) => {
                let subtotal = item.cantidad * item.precio;
                total += subtotal;
                $(`.subtotal-item[data-index="${index}"]`).text('Q' + subtotal.toFixed(2));
            });
            $('#totalPedido').text('Q' + total.toFixed(2));
            localStorage.setItem('carrito_pedidos', JSON.stringify(carrito));
        }

        // Buscar cliente
        $('#buscar_cliente').on('input', function () {
            let q = $(this).val();
            if (q.length < 2) { $('#resultados_cliente').hide(); return; }

            $.get('/ventas/buscar-cliente/', { q: q }, function (data) {
                if (data.length > 0) {
                    let html = '';
                    data.forEach(c => {
                        html += `<a href="#" class="list-group-item list-group-item-action" onclick="seleccionarCliente(${c.id}, '${c.nombre}', '${c.nit}', '${c.direccion || ''}')">
                                    <strong>${c.nit}</strong> - ${c.nombre}
                                </a>`;
                    });
                    $('#resultados_cliente').html(html).show();
                } else {
                    $('#resultados_cliente').html('<div class="list-group-item">No encontrado</div>').show();
                }
            });
        });




        function seleccionarCliente(id, nombre, nit, direccion) {
            clienteSeleccionado = { id: id, nombre: nombre, nit: nit, direccion: direccion };
            $('#cliente_id').val(id);
            $('#cliente_nombre').text(nombre);
            // Mostrar "Consumidor Final" si nit está vacío
            let nitDisplay = (nit && nit !== '') ? nit : 'Consumidor Final';
            $('#cliente_nit').text(nitDisplay);
            $('#cliente_direccion').text(direccion || 'No registrada');
            $('#cliente_seleccionado').show();
            $('#buscar_cliente').val('');
            $('#resultados_cliente').hide();
            $('#consumidor_final').prop('checked', false);
        }

        // Consumidor final (sin NIT)
        $('#consumidor_final').on('change', function () {
            if ($(this).is(':checked')) {
                // Crear cliente sin NIT (NULL)
                $.ajax({
                    url: '/ventas/crear-cliente/',
                    method: 'POST',
                    data: { nit: '', nombre: 'Consumidor Final' },
                    headers: { 'X-CSRFToken': '{{ csrf_token }}' },
                    success: function (response) {
                        if (response.success) {
                            seleccionarCliente(response.id, 'Consumidor Final', '', '');
                        }
                    }
                });
            } else {
                clienteSeleccionado = null;
                $('#cliente_id').val('');
                $('#cliente_seleccionado').hide();
            }
        });


        // Consumidor final
        // Consumidor final
        $('#consumidor_final').on('change', function () {
            if ($(this).is(':checked')) {
                // Buscar o crear cliente Consumidor Final
                $.get('/ventas/buscar-cliente/', { q: 'CF' }, function (data) {
                    let clienteCF = data.find(c => c.nit === 'CF');
                    if (clienteCF) {
                        seleccionarCliente(clienteCF.id, 'Consumidor Final', 'CF', '');
                    } else {
                        // Crear cliente CF si no existe
                        $.ajax({
                            url: '/ventas/crear-cliente/',
                            method: 'POST',
                            data: { nit: 'CF', nombre: 'Consumidor Final' },
                            headers: { 'X-CSRFToken': '{{ csrf_token }}' },
                            success: function (response) {
                                if (response.success) {
                                    seleccionarCliente(response.id, 'Consumidor Final', 'CF', '');
                                }
                            }
                        });
                    }
                });
            } else {
                clienteSeleccionado = null;
                $('#cliente_id').val('');
                $('#cliente_seleccionado').hide();
            }
        });


        $('#btnConfirmar').click(function () {
            if (carrito.length === 0) {
                alert('No hay productos en el carrito');
                return;
            }

            let clienteId = $('#cliente_id').val();
            let clienteNombre = $('#cliente_nombre').text();
            let clienteNit = $('#cliente_nit').text();
            let clienteDireccion = $('#cliente_direccion').text();

            console.log("Cliente ID:", clienteId);
            console.log("Cliente Nombre:", clienteNombre);
            console.log("Cliente NIT:", clienteNit);

            let data = {
                carrito: carrito,
                cliente: {
                    id: clienteId || null,
                    nit: clienteNit === 'No registrada' ? 'CF' : clienteNit,
                    nombre: clienteNombre === 'No registrada' ? 'Consumidor Final' : clienteNombre,
                    direccion: clienteDireccion === 'No registrada' ? '' : clienteDireccion
                }
            };

            $.ajax({
                url: '/pedidos/checkout/',
                method: 'POST',
                contentType: 'application/json',
                headers: { 'X-CSRFToken': '{{ csrf_token }}' },
                data: JSON.stringify(data),
                success: function (response) {
                    if (response.success) {
                        alert('Pedido #' + response.numero_pedido + ' creado exitosamente');
                        localStorage.removeItem('carrito_pedidos');
                        window.location.href = '/pedidos/historial/';
                    } else {
                        alert('Error: ' + response.error);
                    }
                }
            });
        });


        // Nuevo cliente rápido
        $('#formNuevoCliente').submit(function (e) {
            e.preventDefault();
            let formData = new FormData(this);
            $.ajax({
                url: '/ventas/crear-cliente/',
                method: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                headers: { 'X-CSRFToken': '{{ csrf_token }}' },
                success: function (response) {
                    if (response.success) {
                        alert('Cliente creado exitosamente');
                        seleccionarCliente(response.id, response.nombre, response.nit, '');
                        $('#modalNuevoCliente').modal('hide');
                        $('#formNuevoCliente')[0].reset();
                    } else {
                        alert('Error: ' + response.error);
                    }
                }
            });
        });

        if (carrito.length === 0) {
            $('#resumenCarrito').html('<p class="text-muted">No hay productos en el carrito. <a href="{% url "catalogo_pedidos" %}">Ir al catálogo</a></p>');
            $('#btnConfirmar').prop('disabled', true);
        } else {
            mostrarResumen();
        }
    </script>
</body>

</html>

{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada | El Charro</title>
    <style>
        :root {
            --primary: #003B5C;
            --primary-light: #005F8D;
            --accent: #D4AF37;
            --bg-gray: #f4f7f6;
            --white: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--white);
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        /* Recreación del concepto de la imagen */
        .barcode-container {
            margin-bottom: 30px;
        }

        .barcode {
            font-size: 80px;
            letter-spacing: -5px;
            font-family: 'Libre Barcode 39', cursive, sans-serif; /* Simulación visual */
            opacity: 0.9;
        }

        /* Si no tienes una fuente de código de barras, usamos líneas CSS */
        .barcode-svg {
            width: 200px;
            height: 100px;
            fill: var(--white);
            margin: 0 auto;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin: 10px 0;
            font-weight: 300;
        }

        p {
            font-size: 2.5rem;
            margin-bottom: 40px;
            font-weight: lighter;
            font-style: italic;
        }

        .btn-home {
            background-color: var(--accent);
            color: var(--primary);
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-home:hover {
            background-color: var(--white);
            transform: scale(1.05);
        }

        .logo-small {
            position: absolute;
            top: 40px;
            left: 40px;
            height: 50px;
        }

        /* Línea vertical decorativa de la imagen */
        .decoration-line {
            position: absolute;
            right: 15%;
            top: 0;
            bottom: 0;
            width: 1px;
            background: rgba(212, 175, 55, 0.3); /* Dorado con transparencia */
        }
    </style>
</head>
<body>

    <img src="{% static 'img/logo_charro.png' %}" alt="El Charro" class="logo-small">
    
    <div class="decoration-line"></div>

    <div class="container">
        <div class="barcode-container">
            <!-- Icono de código de barras (Concepto inventario) -->
            <svg class="barcode-svg" viewBox="0 0 100 40">
                <rect x="0" width="2" height="40"/> <rect x="5" width="1" height="40"/>
                <rect x="10" width="3" height="40"/> <rect x="18" width="1" height="40"/>
                <rect x="22" width="2" height="40"/> <rect x="28" width="4" height="40"/>
                <rect x="35" width="1" height="40"/> <rect x="40" width="2" height="40"/>
                <rect x="48" width="1" height="40"/> <rect x="52" width="3" height="40"/>
                <rect x="60" width="2" height="40"/> <rect x="68" width="1" height="40"/>
                <rect x="75" width="4" height="40"/> <rect x="85" width="2" height="40"/>
                <rect x="95" width="2" height="40"/>
            </svg>
            <h1>Error 404</h1>
        </div>

        <p>Página no encontrada</p>

        <a href="/" class="btn-home">
            VOLVER AL INICIO <span>→</span>
        </a>
    </div>

</body>
</html>
